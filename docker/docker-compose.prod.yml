version: '3.9'

# ── Kitti Platform — Production Docker Compose ────────────────────────────────
# Includes Nginx as Reverse Proxy & SSL handling

services:

  # ── Nginx Gateway ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: kitti-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - fastapi
      - nodeserver
    networks:
      - kitti-network

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kitti-postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-kitti_db}
      POSTGRES_USER:     ${POSTGRES_USER:-kitti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitti_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kitti-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  # ── FastAPI (Internal) ───────────────────────────────────────────────────────
  fastapi:
    build:
      context: ../fastapi-service
    container_name: kitti-fastapi
    restart: unless-stopped
    expose:
      - "8000"
    env_file: ../fastapi-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kitti}:${POSTGRES_PASSWORD:-kitti_pass}@postgres:5432/${POSTGRES_DB:-kitti_db}
      REDIS_URL:    redis://redis:6379/0
      NODE_ENV:     production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Node.js (Internal) ───────────────────────────────────────────────────────
  nodeserver:
    build:
      context: ../node-server
    container_name: kitti-node
    restart: unless-stopped
    expose:
      - "4000"
    env_file: ../node-server/.env
    environment:
      REDIS_HOST:   redis
      REDIS_PORT:   "6379"
      FASTAPI_URL:  http://fastapi:8000
      NODE_ENV:     production
    depends_on:
      redis:
        condition: service_healthy

  # ── Next.js Frontend (Internal) ─────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_NODE_SERVER_URL: ${DOMAIN_URL:-http://localhost}
        NEXT_PUBLIC_FASTAPI_URL:     ${DOMAIN_URL:-http://localhost}/api/v1
    container_name: kitti-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production

volumes:
  postgres_data:
  redis_data:

networks:
  kitti-network:
    name: kitti-network
    driver: bridge
